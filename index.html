              </div>
              <div>
                <div style={{ fontSize: 9, letterSpacing: 1.5, textTransform: "uppercase", color: "#475569", fontFamily: "sans-serif" }}>Profit</div>
                <div style={{ fontSize: 16, fontWeight: 800, color: previewProfit >= 0 ? "#6ee7b7" : "#fca5a5", marginTop: 2 }}>{fmt(previewProfit)}</div>
              </div>
            </div>
          )}

          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={saveClient} style={{
              flex: 1, background: "#dc2626", color: "#fff", border: "none",
              borderRadius: 8, padding: "11px", fontSize: 14, fontWeight: 700,
              cursor: "pointer", fontFamily: "Georgia, serif",
            }}>{cEditing ? "Update Entry" : "Save Entry"}</button>
            <button onClick={cancelClient} style={{
              padding: "11px 18px", border: "1.5px solid #e2e8f0", borderRadius: 8,
              background: "#fff", color: "#64748b", fontSize: 14, cursor: "pointer",
              fontFamily: "Georgia, serif",
            }}>Cancel</button>
          </div>
        </div>
      )}

      {monthRows.length > 0 && !cOpen && (
        <div style={{
          background: "#fff", borderRadius: 12, padding: "12px 14px",
          marginBottom: 12, boxShadow: "0 2px 8px rgba(15,23,42,0.06)",
        }}>
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="🔍 Search name, phone, location, salesperson…"
            style={{
              width: "100%", border: "1.5px solid #e2e8f0", borderRadius: 8,
              padding: "9px 12px", fontSize: 14, fontFamily: "Georgia, serif",
              background: "#f8fafc", boxSizing: "border-box", outline: "none", marginBottom: 10,
            }} />
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {[
              { key: "all", label: `All (${monthRows.length})` },
              { key: "unpaid", label: `Unpaid (${unpaidCount})` },
              { key: "paid", label: `Paid (${monthRows.length - unpaidCount})` },
            ].map(f => (
              <button key={f.key} onClick={() => setFilter(f.key)} style={{
                padding: "5px 11px", borderRadius: 16, border: "1.5px solid",
                borderColor: filter === f.key ? "#dc2626" : "#e2e8f0",
                background: filter === f.key ? "#dc2626" : "#fff",
                color: filter === f.key ? "#fff" : "#64748b",
                fontSize: 12, cursor: "pointer", fontFamily: "Georgia, serif",
              }}>{f.label}</button>
            ))}
          </div>
        </div>
      )}

      {monthRows.length === 0 ? (
        <div style={{ textAlign: "center", padding: "50px 20px", color: "#94a3b8", background: "#fff", borderRadius: 12, border: "1.5px dashed #e2e8f0" }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>📋</div>
          <div>No entries for {periodLabel}.</div>
        </div>
      ) : visibleRows.length === 0 ? (
        <div style={{ textAlign: "center", padding: "30px 20px", color: "#94a3b8", background: "#fff", borderRadius: 12, border: "1.5px dashed #e2e8f0" }}>No matches.</div>
      ) : (
        <div style={{
          background: "#fff", borderRadius: 12, overflow: "hidden",
          boxShadow: "0 2px 8px rgba(15,23,42,0.06)", marginBottom: 14,
        }}>
          {visibleRows.map((r, idx) => {
            const fullyPaid = r.paid || (num(r.sales) > 0 && r.balance <= 0);
            const photos = r.photos || [];
            return (
              <div key={r.id} style={{
                borderTop: idx > 0 ? "1px solid #f1f5f9" : "none",
                padding: "14px 14px 12px",
                borderLeft: `3px solid ${CAT_COLORS[r.category] || "#94a3b8"}`,
                opacity: fullyPaid ? 0.92 : 1,
              }}>
                <div style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: 8 }}>
                  <PaidToggle checked={fullyPaid} onToggle={() => togglePaid(r.id)} size="lg" />
                  <button onClick={() => setViewingClient(r)} style={{
                    flex: 1, minWidth: 0, background: "transparent", border: "none",
                    textAlign: "left", padding: 0, cursor: "pointer", fontFamily: "Georgia, serif",
                  }}>
                    <div style={{
                      fontWeight: 700, fontSize: 15, color: "#0f172a",
                      textDecoration: fullyPaid ? "line-through" : "none",
                      textDecorationColor: "#94a3b8",
                    }}>{r.client}</div>
                    <div style={{ display: "flex", gap: 6, marginTop: 3, flexWrap: "wrap", alignItems: "center" }}>
                      <span style={{
                        background: (CAT_COLORS[r.category] || "#94a3b8") + "20",
                        color: CAT_COLORS[r.category] || "#94a3b8",
                        borderRadius: 20, padding: "1px 8px",
                        fontSize: 11, fontFamily: "sans-serif", fontWeight: 600,
                      }}>{r.category}</span>
                      {r.salesperson && <span style={{ fontSize: 11, color: "#dc2626", fontFamily: "sans-serif", fontWeight: 600 }}>🧑‍💼 {r.salesperson}</span>}
                      {photos.length > 0 && <span style={{ fontSize: 11, color: "#ec4899", fontFamily: "sans-serif", fontWeight: 600 }}>📸 {photos.length}</span>}
                      {fullyPaid ? (
                        <span style={{ background: "#d1fae5", color: "#065f46", borderRadius: 20, padding: "1px 8px", fontSize: 11, fontFamily: "sans-serif", fontWeight: 700 }}>✓ Paid</span>
                      ) : r.balance > 0 ? (
                        <span style={{ background: "#fef3c7", color: "#92400e", borderRadius: 20, padding: "1px 8px", fontSize: 11, fontFamily: "sans-serif", fontWeight: 700 }}>⏳ {fmt(r.balance)}</span>
                      ) : null}
                    </div>
                  </button>
                  {photos.length > 0 && (
                    <button onClick={() => setViewingClient(r)} style={{ padding: 0, border: "none", background: "none", cursor: "pointer", flexShrink: 0 }}>
                      <img src={photos[0].dataUrl} alt="" style={{ width: 44, height: 44, borderRadius: 8, objectFit: "cover", display: "block", boxShadow: "0 1px 3px rgba(0,0,0,0.15)" }} />
                    </button>
                  )}
                </div>

                <div style={{
                  display: "flex", justifyContent: "space-between", gap: 3,
                  background: "#f8fafc", borderRadius: 8, padding: "8px 8px",
                  fontFamily: "sans-serif",
                }}>
                  {[
                    { label: "Sales", value: fmtShort(r.sales), color: "#dc2626" },
                    { label: "Deposit", value: fmtShort(r.deposit), color: "#10b981" },
                    { label: "Balance", value: fmtShort(r.balance), color: r.balance > 0 && !r.paid ? "#f59e0b" : "#10b981" },
                    { label: "Materials", value: fmtShort(r.materialsCost), color: "#ef4444" },
                    { label: "Tailor", value: fmtShort(num(r.tailorCost)), color: "#9333ea" },
                    { label: "Transp", value: fmtShort(r.transport), color: "#f59e0b" },
                    { label: "Allow", value: fmtShort(r.allowance), color: "#a855f7" },
                    { label: "Profit", value: fmtShort(r.profit), color: r.profit >= 0 ? "#10b981" : "#ef4444" },
                  ].map(m => (
                    <div key={m.label} style={{ flex: 1, textAlign: "center", minWidth: 0 }}>
                      <div style={{ fontSize: 8, letterSpacing: 0.5, textTransform: "uppercase", color: "#94a3b8" }}>{m.label}</div>
                      <div style={{ fontSize: 11, fontWeight: 700, color: m.color, marginTop: 1 }}>{m.value}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}

          <div style={{
            background: "#0f172a", color: "#fff",
            padding: "14px", borderTop: "2px solid #7f1d1d",
          }}>
            <div style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", color: "#475569", fontFamily: "sans-serif", marginBottom: 8, fontWeight: 700 }}>
              Month Total — {monthTotals.count} entries
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", gap: 4, fontFamily: "sans-serif" }}>
              {[
                { label: "Sales", value: fmtShort(monthTotals.sales), color: "#fca5a5" },
                { label: "Cost", value: fmtShort(monthTotals.cost), color: "#fca5a5" },
                { label: "Transp", value: fmtShort(monthTotals.transport), color: "#fcd34d" },
                { label: "Allow", value: fmtShort(monthTotals.allowance), color: "#d8b4fe" },
                { label: "Profit", value: fmtShort(monthTotals.profit), color: monthTotals.profit >= 0 ? "#6ee7b7" : "#fca5a5" },
              ].map(m => (
                <div key={m.label} style={{ flex: 1, textAlign: "center", minWidth: 0 }}>
                  <div style={{ fontSize: 9, letterSpacing: 1, textTransform: "uppercase", color: "#475569" }}>{m.label}</div>
                  <div style={{ fontSize: 14, fontWeight: 800, color: m.color, marginTop: 2 }}>{m.value}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function FormSection({ title, color, children }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color, fontFamily: "sans-serif", marginBottom: 8, fontWeight: 700 }}>{title}</div>
      {children}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
function MonthlySummary({ monthTotals, prevTotals, selectedMonth, prevMonthKey, monthRows, monthPayments, unpaidCount, pctChange, monthCategoryTotals, setTab, periodLabel, viewMode, monthExpenses, cashReceivedThisMonth, monthClientPayments }) {
  return (
    <div>
      <div style={{
        background: "linear-gradient(135deg, #dc2626 0%, #b91c1c 100%)",
        color: "#fff", borderRadius: 14, padding: "20px",
        marginBottom: 14, boxShadow: "0 6px 20px rgba(220,38,38,0.35)",
      }}>
        <div style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", opacity: 0.7, fontFamily: "sans-serif", marginBottom: 4 }}>{periodLabel} Summary</div>
        <div style={{ fontSize: 28, fontWeight: 800, letterSpacing: -1, marginBottom: 2 }}>{fmt(monthTotals.net)}</div>
        <div style={{ fontSize: 12, opacity: 0.85, fontFamily: "sans-serif" }}>Net profit after {monthTotals.count} sale{monthTotals.count !== 1 ? "s" : ""} & all costs</div>
        {viewMode !== "day" && prevTotals.count > 0 && (
          <div style={{ marginTop: 14, padding: "10px 12px", background: "rgba(255,255,255,0.12)", borderRadius: 10 }}>
            <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", opacity: 0.7, fontFamily: "sans-serif", marginBottom: 4 }}>vs {formatMonthKeyShort(prevMonthKey)}</div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontFamily: "sans-serif" }}>
              <span>Last month: {fmt(prevTotals.net)}</span>
              {(() => {
                const change = pctChange(monthTotals.net, prevTotals.net);
                if (change === null) return null;
                const up = change >= 0;
                return <span style={{ fontWeight: 700, color: up ? "#86efac" : "#fca5a5" }}>{up ? "▲" : "▼"} {Math.abs(change).toFixed(1)}%</span>;
              })()}
            </div>
          </div>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
        <div style={{ background: "#fff", borderRadius: 12, padding: "14px", borderTop: "4px solid #dc2626", boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
          <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: "#94a3b8", fontFamily: "sans-serif" }}>💼 Total Sales</div>
          <div style={{ fontSize: 18, fontWeight: 800, color: "#dc2626", marginTop: 4 }}>{fmt(monthTotals.sales)}</div>
        </div>
        <div style={{ background: "#fff", borderRadius: 12, padding: "14px", borderTop: "4px solid #ef4444", boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
          <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: "#94a3b8", fontFamily: "sans-serif" }}>💸 Money Out</div>
          <div style={{ fontSize: 18, fontWeight: 800, color: "#ef4444", marginTop: 4 }}>{fmt(monthTotals.cost + monthTotals.tailorCost + monthTotals.transport + monthTotals.allowance + monthTotals.staffTotal + monthTotals.expBusiness)}</div>
        </div>
      </div>

      {/* Cash actually received this period — separate from the sales total */}
      <div style={{
        background: "linear-gradient(135deg, #047857 0%, #065f46 100%)",
        color: "#fff", borderRadius: 12, padding: "16px",
        marginBottom: 14, boxShadow: "0 4px 12px rgba(4, 120, 87, 0.25)",
      }}>
        <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", opacity: 0.85, fontFamily: "sans-serif" }}>💵 Cash Received This Period</div>
        <div style={{ fontSize: 26, fontWeight: 800, marginTop: 4, letterSpacing: -0.5 }}>{fmt(cashReceivedThisMonth)}</div>
        <div style={{ fontSize: 11, opacity: 0.9, fontFamily: "sans-serif", marginTop: 4 }}>
          Actual money received — includes deposits & top-up payments dated in {periodLabel}
        </div>
      </div>

      <div style={{ background: "#fff", borderRadius: 12, overflow: "hidden", marginBottom: 14, boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
        <div style={{ background: "#0f172a", color: "#fff", padding: "12px 16px" }}>
          <div style={{ fontSize: 13, fontWeight: 800 }}>📋 Full Month Breakdown</div>
          <div style={{ fontSize: 11, color: "#94a3b8", fontFamily: "sans-serif", marginTop: 1 }}>{formatMonthKey(selectedMonth)}</div>
        </div>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
          <tbody>
            {[
              { section: "Income" },
              { label: "Total Sales (Orders)", value: monthTotals.sales, color: "#dc2626", strong: true },
              { label: "💵 Cash Actually Received", value: cashReceivedThisMonth, color: "#10b981", strong: true },
              { label: "Number of Clients", value: monthTotals.count, raw: true, color: "#0f172a" },
              { section: "Material Costs" },
              { label: "Materials Total", value: monthTotals.cost, color: "#ef4444", strong: true, neg: true },
              ...(monthTotals.matCurtains > 0 ? [{ label: "  🪟 Curtains", value: monthTotals.matCurtains, color: "#ef4444", neg: true, indent: true }] : []),
              ...(monthTotals.matSheers > 0 ? [{ label: "  🌫️ Sheers", value: monthTotals.matSheers, color: "#ef4444", neg: true, indent: true }] : []),
              ...(monthTotals.matBlinds > 0 ? [{ label: "  🪟 Blinds", value: monthTotals.matBlinds, color: "#ef4444", neg: true, indent: true }] : []),
              ...(monthTotals.matTapeHooks > 0 ? [{ label: "  🪝 Tape Hooks", value: monthTotals.matTapeHooks, color: "#ef4444", neg: true, indent: true }] : []),
              ...(monthTotals.matTapeRings > 0 ? [{ label: "  ⭕ Tape Rings", value: monthTotals.matTapeRings, color: "#ef4444", neg: true, indent: true }] : []),
              ...(monthTotals.matRings > 0 ? [{ label: "  🔗 Rings", value: monthTotals.matRings, color: "#ef4444", neg: true, indent: true }] : []),
              ...(monthTotals.matHooks > 0 ? [{ label: "  🪡 Hooks", value: monthTotals.matHooks, color: "#ef4444", neg: true, indent: true }] : []),
              ...(monthTotals.matRods > 0 ? [{ label: "  📏 Rods", value: monthTotals.matRods, color: "#ef4444", neg: true, indent: true }] : []),
              ...(monthTotals.matRunners > 0 ? [{ label: "  〰️ Runners", value: monthTotals.matRunners, color: "#ef4444", neg: true, indent: true }] : []),
              ...(monthTotals.matRails > 0 ? [{ label: "  ━ Rails", value: monthTotals.matRails, color: "#ef4444", neg: true, indent: true }] : []),
              { section: "Other Costs" },
              { label: "🧵 Tailor Cost", value: monthTotals.tailorCost, color: "#9333ea", neg: true },
              { label: "Transport", value: monthTotals.transport, color: "#f59e0b", neg: true },
              { label: "Allowance", value: monthTotals.allowance, color: "#a855f7", neg: true },
              { section: "Profit" },
              { label: "Gross Profit", value: monthTotals.profit, color: monthTotals.profit >= 0 ? "#10b981" : "#ef4444", strong: true },
              { section: "Staff" },
              { label: "Salaries Paid", value: monthTotals.salTotal, color: "#7c3aed", neg: true },
              { label: "Advances Given", value: monthTotals.advTotal, color: "#be185d", neg: true },
              { section: "Other Expenses" },
              { label: "🏪 Business Expenses", value: monthTotals.expBusiness, color: "#be185d", neg: true },
              { label: "🏠 Personal Expenses (not in profit)", value: monthTotals.expPersonal, color: "#94a3b8", raw: false },
              { section: "Bottom Line" },
              { label: "NET PROFIT", value: monthTotals.net, color: monthTotals.net >= 0 ? "#10b981" : "#ef4444", strong: true, big: true },
            ].map((row, i) => {
              if (row.section) {
                return (
                  <tr key={i}>
                    <td colSpan={2} style={{
                      padding: "10px 16px", background: "#f8fafc",
                      fontSize: 10, letterSpacing: 2, textTransform: "uppercase",
                      color: "#94a3b8", fontFamily: "sans-serif", fontWeight: 700,
                      borderTop: i > 0 ? "1px solid #e2e8f0" : "none",
                    }}>{row.section}</td>
                  </tr>
                );
              }
              return (
                <tr key={i} style={{ borderTop: "1px solid #f1f5f9" }}>
                  <td style={{ padding: "11px 16px", color: "#475569", fontFamily: "sans-serif", fontSize: 13 }}>{row.label}</td>
                  <td style={{
                    padding: "11px 16px", textAlign: "right",
                    color: row.color || "#0f172a",
                    fontWeight: row.strong ? 800 : 600,
                    fontSize: row.big ? 17 : 14,
                  }}>{row.neg && row.value > 0 ? "-" : ""}{row.raw ? row.value : fmt(row.value)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {monthTotals.balance > 0 && (
        <div style={{
          background: "#fff7ed", border: "1.5px solid #fed7aa",
          borderRadius: 12, padding: "14px 16px", marginBottom: 14,
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", color: "#9a3412", fontFamily: "sans-serif", fontWeight: 700 }}>⏳ Outstanding (not in totals)</div>
              <div style={{ fontSize: 12, color: "#9a3412", fontFamily: "sans-serif", marginTop: 2 }}>{unpaidCount} client{unpaidCount !== 1 ? "s" : ""} owe money</div>
            </div>
            <div style={{ fontSize: 20, fontWeight: 800, color: "#c2410c" }}>{fmt(monthTotals.balance)}</div>
          </div>
        </div>
      )}

      {monthRows.length === 0 && monthPayments.length === 0 && (
        <div style={{ textAlign: "center", padding: "40px 20px", color: "#94a3b8", background: "#fff", borderRadius: 12, border: "1.5px dashed #e2e8f0" }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>📅</div>
          <div>No data for {formatMonthKey(selectedMonth)} yet.</div>
          <button onClick={() => setTab("sales")} style={{
            marginTop: 14, background: "#dc2626", color: "#fff", border: "none",
            borderRadius: 8, padding: "9px 18px", fontSize: 13, cursor: "pointer", fontFamily: "Georgia, serif",
          }}>Add an entry</button>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
function CategoriesTab({ monthRows, selectedMonth, monthCategoryTotals, monthTotals }) {
  if (monthRows.length === 0) {
    return (
      <div style={{ textAlign: "center", padding: "50px 20px", color: "#94a3b8", background: "#fff", borderRadius: 12, border: "1.5px dashed #e2e8f0" }}>
        <div style={{ fontSize: 36, marginBottom: 10 }}>📊</div>
        <div>No data for {formatMonthKey(selectedMonth)}.</div>
      </div>
    );
  }
  return (
    <div style={{ background: "#fff", borderRadius: 12, overflow: "hidden", boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
      <div style={{ background: "#0f172a", color: "#fff", padding: "12px 16px" }}>
        <div style={{ fontSize: 13, fontWeight: 800 }}>📊 Category Performance</div>
        <div style={{ fontSize: 11, color: "#94a3b8", fontFamily: "sans-serif", marginTop: 1 }}>{formatMonthKey(selectedMonth)}</div>
      </div>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
        <thead>
          <tr style={{ background: "#f8fafc" }}>
            <th style={{ padding: "10px 12px", textAlign: "left", fontSize: 9, letterSpacing: 1, textTransform: "uppercase", color: "#94a3b8", fontFamily: "sans-serif" }}>Category</th>
            <th style={{ padding: "10px 8px", textAlign: "right", fontSize: 9, letterSpacing: 1, textTransform: "uppercase", color: "#94a3b8", fontFamily: "sans-serif" }}>Sales</th>
            <th style={{ padding: "10px 8px", textAlign: "right", fontSize: 9, letterSpacing: 1, textTransform: "uppercase", color: "#94a3b8", fontFamily: "sans-serif" }}>Costs</th>
            <th style={{ padding: "10px 12px", textAlign: "right", fontSize: 9, letterSpacing: 1, textTransform: "uppercase", color: "#94a3b8", fontFamily: "sans-serif" }}>Profit</th>
          </tr>
        </thead>
        <tbody>
          {CATEGORIES.filter(c => monthCategoryTotals[c]?.count > 0).map(cat => {
            const t = monthCategoryTotals[cat];
            const margin = t.sales ? ((t.profit / t.sales) * 100).toFixed(0) : 0;
            return (
              <tr key={cat} style={{ borderTop: "1px solid #f1f5f9" }}>
                <td style={{ padding: "12px" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ width: 10, height: 10, borderRadius: 3, background: CAT_COLORS[cat] }}></span>
                    <div>
                      <div style={{ fontWeight: 700, color: "#0f172a", fontSize: 13 }}>{cat}</div>
                      <div style={{ fontSize: 10, color: "#94a3b8", fontFamily: "sans-serif" }}>{t.count} client{t.count !== 1 ? "s" : ""} · {margin}%</div>
                    </div>
                  </div>
                </td>
                <td style={{ padding: "12px 8px", textAlign: "right", color: "#dc2626", fontWeight: 700 }}>{fmtShort(t.sales)}</td>
                <td style={{ padding: "12px 8px", textAlign: "right", color: "#ef4444", fontWeight: 700 }}>{fmtShort(t.cost + t.transport + t.allowance)}</td>
                <td style={{ padding: "12px", textAlign: "right", color: t.profit >= 0 ? "#10b981" : "#ef4444", fontWeight: 800 }}>{fmtShort(t.profit)}</td>
              </tr>
            );
          })}
        </tbody>
        <tfoot>
          <tr style={{ background: "#0f172a", color: "#fff" }}>
            <td style={{ padding: "12px", fontWeight: 800, fontSize: 12, letterSpacing: 1 }}>TOTAL</td>
            <td style={{ padding: "12px 8px", textAlign: "right", fontWeight: 800, color: "#fca5a5" }}>{fmtShort(monthTotals.sales)}</td>
            <td style={{ padding: "12px 8px", textAlign: "right", fontWeight: 800, color: "#fca5a5" }}>{fmtShort(monthTotals.cost + monthTotals.transport + monthTotals.allowance)}</td>
            <td style={{ padding: "12px", textAlign: "right", fontWeight: 800, color: monthTotals.profit >= 0 ? "#6ee7b7" : "#fca5a5" }}>{fmtShort(monthTotals.profit)}</td>
          </tr>
        </tfoot>
      </table>
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════════════════
// ── EXPENSES TAB ──────────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════
function ExpensesTab({ expenses, selectedMonth, eOpen, setEOpen, eForm, setEForm, eEditing, saveExpense, cancelExpense, editExpense, deleteExpense, periodLabel, viewMode, selectedDate, monthExpenses }) {
  const [filterCat, setFilterCat] = useState("all");

  // monthExpenses comes pre-filtered (day or month) from parent
  // Filter by category if needed
  const visibleExpenses = filterCat === "all"
    ? monthExpenses
    : monthExpenses.filter(e => e.category === filterCat);

  // Sort newest first
  const sortedExpenses = [...visibleExpenses].sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  // Calculate totals by category
  const categoryTotals = {};
  monthExpenses.forEach(e => {
    if (!categoryTotals[e.category]) categoryTotals[e.category] = { total: 0, count: 0 };
    categoryTotals[e.category].total += num(e.amount);
    categoryTotals[e.category].count += 1;
  });

  const totalAll = monthExpenses.reduce((a, e) => a + num(e.amount), 0);
  const totalBusiness = monthExpenses.filter(e => e.forBusiness !== false).reduce((a, e) => a + num(e.amount), 0);
  const totalPersonal = monthExpenses.filter(e => e.forBusiness === false).reduce((a, e) => a + num(e.amount), 0);

  return (
    <div>
      {/* TOTAL CARD */}
      <div style={{
        background: "linear-gradient(135deg, #be185d 0%, #831843 100%)",
        color: "#fff", borderRadius: 14, padding: "20px",
        marginBottom: 16, boxShadow: "0 6px 18px rgba(190, 24, 93, 0.3)",
      }}>
        <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", opacity: 0.85, fontFamily: "sans-serif", marginBottom: 4 }}>
          {periodLabel} Expenses
        </div>
        <div style={{ fontSize: 32, fontWeight: 800, letterSpacing: -1, marginBottom: 12 }}>{fmt(totalAll)}</div>
        <div style={{ display: "flex", gap: 12, fontSize: 12 }}>
          <div style={{ flex: 1, background: "rgba(255,255,255,0.15)", borderRadius: 8, padding: "8px 10px" }}>
            <div style={{ fontSize: 10, opacity: 0.85, fontFamily: "sans-serif" }}>🏪 Business</div>
            <div style={{ fontSize: 16, fontWeight: 800 }}>{fmtShort(totalBusiness)}</div>
          </div>
          <div style={{ flex: 1, background: "rgba(255,255,255,0.15)", borderRadius: 8, padding: "8px 10px" }}>
            <div style={{ fontSize: 10, opacity: 0.85, fontFamily: "sans-serif" }}>🏠 Personal</div>
            <div style={{ fontSize: 16, fontWeight: 800 }}>{fmtShort(totalPersonal)}</div>
          </div>
        </div>
      </div>

      {/* ADD BUTTON */}
      {!eOpen && (
        <button onClick={() => {
          // When in day view, pre-fill date to the selected date
          if (viewMode === "day") setEForm(f => ({ ...f, date: selectedDate }));
          setEOpen(true);
        }} style={{
          width: "100%", background: "#be185d", color: "#fff", border: "none",
          borderRadius: 12, padding: "14px", fontSize: 15, fontWeight: 700,
          cursor: "pointer", fontFamily: "Georgia, serif", marginBottom: 16,
          boxShadow: "0 4px 12px rgba(190, 24, 93, 0.25)",
        }}>+ Add Expense</button>
      )}

      {/* EXPENSE FORM */}
      {eOpen && (
        <div style={{
          background: "#fff", borderRadius: 12, padding: "18px",
          marginBottom: 16, boxShadow: "0 2px 12px rgba(15,23,42,0.1)",
          borderLeft: "4px solid #be185d",
        }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 14, color: "#0f172a" }}>
            {eEditing ? "✏️ Edit Expense" : "➕ Record New Expense"}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
            <Field label="Category" span={2}>
              <TSelect value={eForm.category} onChange={v => setEForm(f => ({ ...f, category: v }))}>
                {EXPENSE_CATEGORIES.map(c => (
                  <option key={c.value} value={c.value}>{c.emoji} {c.value}</option>
                ))}
              </TSelect>
            </Field>
            <Field label="Amount (KSh)">
              <TInput type="number" value={eForm.amount} onChange={v => setEForm(f => ({ ...f, amount: v }))} placeholder="0" />
            </Field>
            <Field label="Date">
              <TInput type="date" value={eForm.date} onChange={v => setEForm(f => ({ ...f, date: v }))} />
            </Field>
            <Field label="📝 Note (optional)" span={2}>
              <TInput value={eForm.note} onChange={v => setEForm(f => ({ ...f, note: v }))} placeholder="e.g. May rent, fuel for Karen delivery, etc." />
            </Field>
          </div>
          <label style={{
            display: "flex", alignItems: "center", gap: 12, padding: "10px 12px",
            background: eForm.forBusiness ? "#fce7f3" : "#f8fafc",
            border: `1.5px solid ${eForm.forBusiness ? "#be185d" : "#e2e8f0"}`,
            borderRadius: 10, cursor: "pointer", marginBottom: 14,
          }}>
            <PaidToggle checked={eForm.forBusiness} onToggle={() => setEForm(f => ({ ...f, forBusiness: !f.forBusiness }))} size="md" />
            <div style={{ fontSize: 13, fontWeight: 600, color: eForm.forBusiness ? "#831843" : "#0f172a", fontFamily: "sans-serif" }}>
              {eForm.forBusiness ? "🏪 Business expense" : "🏠 Personal expense"}
            </div>
          </label>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={saveExpense} style={{
              flex: 1, background: "#be185d", color: "#fff", border: "none",
              borderRadius: 8, padding: "11px", fontSize: 14, fontWeight: 700,
              cursor: "pointer", fontFamily: "Georgia, serif",
            }}>{eEditing ? "Update" : "Save Expense"}</button>
            <button onClick={cancelExpense} style={{
              padding: "11px 18px", border: "1.5px solid #e2e8f0", borderRadius: 8,
              background: "#fff", color: "#64748b", fontSize: 14, cursor: "pointer",
              fontFamily: "Georgia, serif",
            }}>Cancel</button>
          </div>
        </div>
      )}

      {/* BREAKDOWN BY CATEGORY */}
      {monthExpenses.length > 0 && (
        <div style={{
          background: "#fff", borderRadius: 12, overflow: "hidden",
          marginBottom: 16, boxShadow: "0 2px 8px rgba(15,23,42,0.06)",
        }}>
          <div style={{ background: "#0f172a", color: "#fff", padding: "12px 16px" }}>
            <div style={{ fontSize: 13, fontWeight: 800 }}>📊 Breakdown by Category</div>
          </div>
          <div style={{ padding: "4px 0" }}>
            <button onClick={() => setFilterCat("all")} style={{
              width: "100%", textAlign: "left", padding: "10px 16px",
              background: filterCat === "all" ? "#fef2f2" : "transparent",
              border: "none", borderBottom: "1px solid #f1f5f9",
              cursor: "pointer", fontFamily: "Georgia, serif",
              display: "flex", justifyContent: "space-between", alignItems: "center",
            }}>
              <span style={{ fontWeight: 700, fontSize: 13 }}>📋 All Categories</span>
              <span style={{ fontWeight: 800, fontSize: 13, color: "#be185d" }}>{fmt(totalAll)}</span>
            </button>
            {EXPENSE_CATEGORIES.filter(c => categoryTotals[c.value]?.count > 0).map(c => {
              const t = categoryTotals[c.value];
              return (
                <button key={c.value} onClick={() => setFilterCat(c.value)} style={{
                  width: "100%", textAlign: "left", padding: "10px 16px",
                  background: filterCat === c.value ? "#fef2f2" : "transparent",
                  border: "none", borderBottom: "1px solid #f1f5f9",
                  cursor: "pointer", fontFamily: "Georgia, serif",
                  display: "flex", justifyContent: "space-between", alignItems: "center",
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ width: 10, height: 10, borderRadius: 3, background: c.color }}></span>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 13, color: "#0f172a" }}>{c.emoji} {c.value}</div>
                      <div style={{ fontSize: 10, color: "#94a3b8", fontFamily: "sans-serif" }}>{t.count} entr{t.count !== 1 ? "ies" : "y"}</div>
                    </div>
                  </div>
                  <span style={{ fontWeight: 800, fontSize: 13, color: c.color }}>{fmt(t.total)}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* EXPENSE LIST */}
      {monthExpenses.length === 0 ? (
        <div style={{ textAlign: "center", padding: "50px 20px", color: "#94a3b8", background: "#fff", borderRadius: 12, border: "1.5px dashed #e2e8f0" }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>💸</div>
          <div>No expenses for {periodLabel}.</div>
          <div style={{ fontSize: 11, marginTop: 6 }}>Tap <strong>+ Add Expense</strong> to start tracking.</div>
        </div>
      ) : (
        <div style={{ background: "#fff", borderRadius: 12, overflow: "hidden", boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
          {sortedExpenses.map((e, i) => {
            const cat = EXPENSE_CATEGORIES.find(c => c.value === e.category) || EXPENSE_CATEGORIES[EXPENSE_CATEGORIES.length - 1];
            return (
              <div key={e.id} style={{
                padding: "14px 16px", borderTop: i > 0 ? "1px solid #f1f5f9" : "none",
                display: "flex", alignItems: "center", gap: 12,
              }}>
                <div style={{
                  width: 40, height: 40, borderRadius: 10,
                  background: cat.color, color: "#fff",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontSize: 18, flexShrink: 0,
                }}>{cat.emoji}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, color: "#0f172a" }}>{e.category}</div>
                  <div style={{ fontSize: 11, color: "#94a3b8", fontFamily: "sans-serif" }}>
                    {e.date} · {e.forBusiness === false ? "🏠 Personal" : "🏪 Business"}
                  </div>
                  {e.note && (
                    <div style={{ fontSize: 11, color: "#64748b", fontFamily: "sans-serif", marginTop: 2, fontStyle: "italic" }}>
                      {e.note}
                    </div>
                  )}
                </div>
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  <div style={{ fontSize: 15, fontWeight: 800, color: cat.color }}>{fmt(num(e.amount))}</div>
                  <div style={{ display: "flex", gap: 4, justifyContent: "flex-end", marginTop: 4 }}>
                    <button onClick={() => editExpense(e)} style={{
                      background: "#f1f5f9", border: "none", borderRadius: 6,
                      padding: "4px 8px", fontSize: 10, cursor: "pointer", color: "#0f172a",
                      fontFamily: "sans-serif",
                    }}>Edit</button>
                    <button onClick={() => deleteExpense(e.id)} style={{
                      background: "#fee2e2", border: "none", borderRadius: 6,
                      padding: "4px 8px", fontSize: 10, cursor: "pointer", color: "#dc2626",
                      fontFamily: "sans-serif",
                    }}>Del</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}


// ══════════════════════════════════════════════════════════════════════════════
// ── PENDING TAB ───────────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════
function PendingTab({ clients, togglePaid, toggleDelivered, setViewingClient }) {
  const [section, setSection] = useState("orders"); // "orders" or "balances"

  // Clients are already decorated with the correct balance (sales - deposit - logged payments)
  const rows = clients.map(c => ({
    ...c,
    // Ensure balance exists even if somehow not pre-computed
    balance: c.balance != null ? c.balance : Math.max(0, num(c.sales) - num(c.deposit) - (c.ledgerPaid || 0)),
  }));

  // Pending orders: not delivered yet (regardless of payment)
  const pendingOrders = rows
    .filter(r => !r.delivered)
    .sort((a, b) => (a.date || "").localeCompare(b.date || "")); // oldest first

  // Pending balances: not fully paid AND balance > 0
  // Includes both delivered-not-paid AND not-delivered-not-paid
  const pendingBalances = rows
    .filter(r => !r.paid && r.balance > 0)
    .sort((a, b) => (a.date || "").localeCompare(b.date || ""));

  // Totals
  const totalPendingBalance = pendingBalances.reduce((a, r) => a + r.balance, 0);
  const totalOrderValue = pendingOrders.reduce((a, r) => a + num(r.sales), 0);

  const list = section === "orders" ? pendingOrders : pendingBalances;

  return (
    <div>
      {/* Top KPI cards */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
        <button onClick={() => setSection("orders")} style={{
          background: section === "orders" ? "linear-gradient(135deg, #f59e0b, #d97706)" : "#fff",
          color: section === "orders" ? "#fff" : "#0f172a",
          border: section === "orders" ? "none" : "2px solid #e2e8f0",
          borderRadius: 14, padding: "16px", textAlign: "left",
          cursor: "pointer", fontFamily: "Georgia, serif",
          boxShadow: section === "orders" ? "0 6px 16px rgba(245, 158, 11, 0.3)" : "0 2px 8px rgba(15,23,42,0.06)",
        }}>
          <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", opacity: section === "orders" ? 0.85 : 0.5, fontFamily: "sans-serif" }}>📦 Awaiting Delivery</div>
          <div style={{ fontSize: 24, fontWeight: 800, marginTop: 4 }}>{pendingOrders.length}</div>
          <div style={{ fontSize: 11, opacity: section === "orders" ? 0.9 : 0.6, marginTop: 2, fontFamily: "sans-serif" }}>{fmt(totalOrderValue)} total</div>
        </button>
        <button onClick={() => setSection("balances")} style={{
          background: section === "balances" ? "linear-gradient(135deg, #ef4444, #dc2626)" : "#fff",
          color: section === "balances" ? "#fff" : "#0f172a",
          border: section === "balances" ? "none" : "2px solid #e2e8f0",
          borderRadius: 14, padding: "16px", textAlign: "left",
          cursor: "pointer", fontFamily: "Georgia, serif",
          boxShadow: section === "balances" ? "0 6px 16px rgba(239, 68, 68, 0.3)" : "0 2px 8px rgba(15,23,42,0.06)",
        }}>
          <div style={{ fontSize: 10, letterSpacing: 1.5, textTransform: "uppercase", opacity: section === "balances" ? 0.85 : 0.5, fontFamily: "sans-serif" }}>💰 Unpaid Balances</div>
          <div style={{ fontSize: 24, fontWeight: 800, marginTop: 4 }}>{pendingBalances.length}</div>
          <div style={{ fontSize: 11, opacity: section === "balances" ? 0.9 : 0.6, marginTop: 2, fontFamily: "sans-serif" }}>{fmt(totalPendingBalance)} owed</div>
        </button>
      </div>

      {/* List */}
      {list.length === 0 ? (
        <div style={{ textAlign: "center", padding: "50px 20px", color: "#94a3b8", background: "#fff", borderRadius: 12, border: "1.5px dashed #e2e8f0" }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>{section === "orders" ? "✅" : "🎉"}</div>
          <div>{section === "orders" ? "All orders delivered!" : "No outstanding balances!"}</div>
          <div style={{ fontSize: 11, marginTop: 6 }}>You're all caught up.</div>
        </div>
      ) : (
        <div style={{ background: "#fff", borderRadius: 12, overflow: "hidden", boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
          {list.map((r, i) => (
            <div key={r.id} style={{
              padding: "14px 16px",
              borderTop: i > 0 ? "1px solid #f1f5f9" : "none",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, marginBottom: 10 }}>
                <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => setViewingClient(r)}>
                  <div style={{ fontWeight: 700, fontSize: 15, color: "#0f172a" }}>{r.client || "Unnamed"}</div>
                  <div style={{ fontSize: 11, color: "#94a3b8", fontFamily: "sans-serif", marginTop: 2 }}>
                    {r.date} {r.phone && `· 📱 ${r.phone}`} {r.location && `· 📍 ${r.location}`}
                  </div>
                  <div style={{ display: "flex", gap: 8, marginTop: 6, flexWrap: "wrap" }}>
                    {!r.delivered && (
                      <span style={{ fontSize: 10, padding: "2px 8px", background: "#fef3c7", color: "#92400e", borderRadius: 4, fontWeight: 700, fontFamily: "sans-serif" }}>📦 NOT DELIVERED</span>
                    )}
                    {r.delivered && (
                      <span style={{ fontSize: 10, padding: "2px 8px", background: "#d1fae5", color: "#065f46", borderRadius: 4, fontWeight: 700, fontFamily: "sans-serif" }}>✅ DELIVERED</span>
                    )}
                    {!r.paid && r.balance > 0 && (
                      <span style={{ fontSize: 10, padding: "2px 8px", background: "#fee2e2", color: "#991b1b", borderRadius: 4, fontWeight: 700, fontFamily: "sans-serif" }}>💰 BALANCE DUE</span>
                    )}
                  </div>
                </div>
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  <div style={{ fontSize: 10, color: "#94a3b8", letterSpacing: 1, textTransform: "uppercase", fontFamily: "sans-serif" }}>Balance</div>
                  <div style={{ fontSize: 18, fontWeight: 800, color: r.balance > 0 ? "#ef4444" : "#10b981" }}>{fmt(r.balance)}</div>
                  <div style={{ fontSize: 11, color: "#64748b", fontFamily: "sans-serif", marginTop: 2 }}>
                    {fmtShort((r.totalReceived != null ? r.totalReceived : num(r.deposit)))} of {fmtShort(r.sales)}
                  </div>
                </div>
              </div>

              {/* Action buttons */}
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => toggleDelivered(r.id)} style={{
                  flex: 1, padding: "10px", border: "none", borderRadius: 8,
                  background: r.delivered ? "#10b981" : "#f59e0b",
                  color: "#fff", fontWeight: 700, fontSize: 12,
                  cursor: "pointer", fontFamily: "Georgia, serif",
                }}>
                  {r.delivered ? "✅ Delivered" : "📦 Mark Delivered"}
                </button>
                <button onClick={() => togglePaid(r.id)} style={{
                  flex: 1, padding: "10px", border: "none", borderRadius: 8,
                  background: r.paid ? "#10b981" : "#dc2626",
                  color: "#fff", fontWeight: 700, fontSize: 12,
                  cursor: "pointer", fontFamily: "Georgia, serif",
                }}>
                  {r.paid ? "✅ Paid" : "💰 Mark Paid"}
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── AUDIT TAB ─────────────────────────────────────────────────────────────────
// Transparency tool: shows raw numbers and the math behind every total
// ══════════════════════════════════════════════════════════════════════════════
function AuditTab({ clients, monthRows, monthPayments, monthExpenses, monthClientPayments, cashReceivedThisMonth, monthTotals, payments, expenses, clientPayments, selectedMonth, selectedDate, viewMode, periodLabel }) {
  const [section, setSection] = useState("monthly");
  const [copied, setCopied] = useState(false);

  // Compute net manually as a double-check
  const checkProfit = (r) => {
    const mat = num(r.curtainsCost) + num(r.sheersCost) + num(r.blindsCost) + num(r.tapeHooksCost) + num(r.tapeRingsCost)
      + num(r.ringsCost) + num(r.hooksCost) + num(r.rodsCost) + num(r.runnersCost) + num(r.railsCost);
    const materials = mat > 0 ? mat : num(r.cost);
    return num(r.sales) - materials - num(r.tailorCost) - num(r.transport) - num(r.allowance);
  };

  // Sum verify
  const cashFromTopUps = (monthClientPayments || []).reduce((s, p) => s + num(p.amount), 0);
  const cashFromDeposits = monthRows.reduce((s, r) => s + num(r.deposit), 0);
  const verify = {
    sales: monthRows.reduce((s, r) => s + num(r.sales), 0),
    cashReceived: cashFromTopUps + cashFromDeposits,
    cashFromTopUps,
    cashFromDeposits,
    materials: monthRows.reduce((s, r) => s + (r.materialsCost ?? num(r.cost)), 0),
    tailor: monthRows.reduce((s, r) => s + num(r.tailorCost), 0),
    transport: monthRows.reduce((s, r) => s + num(r.transport), 0),
    allowance: monthRows.reduce((s, r) => s + num(r.allowance), 0),
    profit: monthRows.reduce((s, r) => s + checkProfit(r), 0),
    salaries: monthPayments.filter(p => p.type === "Salary").reduce((s, p) => s + num(p.amount), 0),
    advances: monthPayments.filter(p => p.type === "Advance").reduce((s, p) => s + num(p.amount), 0),
    expBusiness: monthExpenses.filter(e => e.forBusiness !== false).reduce((s, e) => s + num(e.amount), 0),
    expPersonal: monthExpenses.filter(e => e.forBusiness === false).reduce((s, e) => s + num(e.amount), 0),
    unpaidBalance: monthRows.reduce((s, r) => s + ((!r.paid && r.balance > 0) ? r.balance : 0), 0),
  };
  const expectedNet = verify.profit - verify.salaries - verify.advances - verify.expBusiness;

  // Export everything as CSV-ish text
  const exportData = () => {
    const lines = [];
    lines.push(`=== AUDIT EXPORT — ${periodLabel} ===`);
    lines.push("");
    lines.push("CLIENTS THIS PERIOD:");
    lines.push("Date | Client | Sales | Deposit | Balance | Materials | Tailor | Transport | Allowance | Profit | Paid? | Delivered?");
    monthRows.forEach(r => {
      lines.push(`${r.date} | ${r.client} | ${num(r.sales)} | ${num(r.deposit)} | ${r.balance} | ${r.materialsCost ?? num(r.cost)} | ${num(r.tailorCost)} | ${num(r.transport)} | ${num(r.allowance)} | ${r.profit.toFixed(0)} | ${r.paid ? "YES" : "NO"} | ${r.delivered ? "YES" : "NO"}`);
    });
    lines.push("");
    lines.push("PAYMENTS THIS PERIOD:");
    lines.push("Date | Type | Amount | Note");
    monthPayments.forEach(p => {
      lines.push(`${p.date} | ${p.type} | ${num(p.amount)} | ${p.note || ""}`);
    });
    lines.push("");
    lines.push("EXPENSES THIS PERIOD:");
    lines.push("Date | Category | Amount | Business? | Note");
    monthExpenses.forEach(e => {
      lines.push(`${e.date} | ${e.category} | ${num(e.amount)} | ${e.forBusiness !== false ? "YES" : "NO"} | ${e.note || ""}`);
    });
    lines.push("");
    lines.push("TOTALS:");
    lines.push(`Total Sales: ${verify.sales}`);
    lines.push(`Total Materials Cost: ${verify.materials}`);
    lines.push(`Total Tailor Cost: ${verify.tailor}`);
    lines.push(`Total Transport: ${verify.transport}`);
    lines.push(`Total Allowance: ${verify.allowance}`);
    lines.push(`Gross Profit: ${verify.profit.toFixed(0)}`);
    lines.push(`Salaries Paid: ${verify.salaries}`);
    lines.push(`Advances Given: ${verify.advances}`);
    lines.push(`Business Expenses: ${verify.expBusiness}`);
    lines.push(`Personal Expenses: ${verify.expPersonal}`);
    lines.push(`NET PROFIT: ${expectedNet.toFixed(0)}`);
    lines.push(`Outstanding Balance: ${verify.unpaidBalance}`);

    const text = lines.join("\n");
    try {
      navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    } catch (e) {
      alert("Copy failed. Here's the data:\n\n" + text);
    }
  };

  const matches = (a, b) => Math.abs(a - b) < 1;
  const Row = ({ label, value, formula, bold }) => (
    <div style={{
      padding: "10px 12px", borderTop: "1px solid #f1f5f9",
      display: "flex", justifyContent: "space-between", alignItems: "flex-start",
      gap: 12,
    }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 13, fontWeight: bold ? 800 : 600, color: "#0f172a", fontFamily: "sans-serif" }}>{label}</div>
        {formula && <div style={{ fontSize: 10, color: "#64748b", fontFamily: "monospace", marginTop: 3 }}>{formula}</div>}
      </div>
      <div style={{ fontSize: bold ? 16 : 14, fontWeight: bold ? 800 : 700, color: "#0f172a", whiteSpace: "nowrap" }}>{fmt(value)}</div>
    </div>
  );

  return (
    <div>
      {/* Warning banner */}
      <div style={{
        background: "#fef3c7", border: "1.5px solid #fde68a", borderRadius: 12,
        padding: "12px 14px", marginBottom: 14, fontFamily: "sans-serif",
      }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#92400e", marginBottom: 4 }}>🔎 Audit Mode — Raw Data View</div>
        <div style={{ fontSize: 11, color: "#78350f", lineHeight: 1.5 }}>
          Use this tab to verify the app's math. Take any number below, plug it into a calculator, confirm it matches. If a number looks wrong, screenshot it and tell me — I'll fix it.
        </div>
      </div>

      {/* Section selector */}
      <div style={{ display: "flex", gap: 6, marginBottom: 14, background: "#f1f5f9", padding: 4, borderRadius: 8 }}>
        {[
          { key: "monthly", label: "📊 Totals" },
          { key: "clients", label: "👤 Clients" },
          { key: "payments", label: "💵 Pay" },
          { key: "expenses", label: "💸 Exp" },
        ].map(s => (
          <button key={s.key} onClick={() => setSection(s.key)} style={{
            flex: 1, padding: "7px 6px", border: "none", borderRadius: 6,
            background: section === s.key ? "#0f172a" : "transparent",
            color: section === s.key ? "#fff" : "#64748b",
            fontWeight: 700, fontSize: 11, fontFamily: "Georgia, serif",
            cursor: "pointer",
          }}>{s.label}</button>
        ))}
      </div>

      {/* Export button */}
      <button onClick={exportData} style={{
        width: "100%", background: copied ? "#10b981" : "#0f172a",
        color: "#fff", border: "none", borderRadius: 10,
        padding: "11px", fontSize: 13, fontWeight: 700, cursor: "pointer",
        fontFamily: "Georgia, serif", marginBottom: 14,
      }}>{copied ? "✅ Copied! Paste into a spreadsheet to verify" : "📋 Copy ALL data to clipboard (for spreadsheet check)"}</button>

      {/* === MONTHLY TOTALS SECTION === */}
      {section === "monthly" && (
        <div style={{ background: "#fff", borderRadius: 12, overflow: "hidden", boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
          <div style={{ background: "#0f172a", color: "#fff", padding: "12px 14px" }}>
            <div style={{ fontSize: 13, fontWeight: 800 }}>📊 {periodLabel} — Step by Step</div>
            <div style={{ fontSize: 10, opacity: 0.8, fontFamily: "sans-serif", marginTop: 2 }}>{monthRows.length} client entries</div>
          </div>

          <Row label="① Total Sales" value={verify.sales} formula={`Sum of sales from ${monthRows.length} clients`} bold />
          <Row label="💵 Cash Received This Period" value={verify.cashReceived} formula={`Deposits dated this period (${fmt(verify.cashFromDeposits)}) + Top-up payments dated this period (${fmt(verify.cashFromTopUps)})`} bold />
          <Row label="② Materials Cost" value={verify.materials} formula="Sum of all material costs" />
          <Row label="③ Tailor Cost" value={verify.tailor} formula="Sum of tailor field" />
          <Row label="④ Transport" value={verify.transport} formula="Sum of transport field" />
          <Row label="⑤ Allowance" value={verify.allowance} formula="Sum of allowance field" />
          <Row label="⑥ GROSS PROFIT" value={verify.profit} formula="① − ② − ③ − ④ − ⑤" bold />
          <Row label="⑦ Salaries Paid" value={verify.salaries} formula="Sum of staff salary payments" />
          <Row label="⑧ Advances Given" value={verify.advances} formula="Sum of staff advance payments" />
          <Row label="⑨ Business Expenses" value={verify.expBusiness} formula="Sum of expenses where business = yes" />
          <Row label="⑩ NET PROFIT" value={expectedNet} formula="⑥ − ⑦ − ⑧ − ⑨" bold />
          <Row label="Personal Expenses (separate)" value={verify.expPersonal} formula="Not included in profit" />
          <Row label="Outstanding Balance" value={verify.unpaidBalance} formula="Sum of balance where paid=NO" />

          {/* Cross-check vs what app shows */}
          <div style={{ background: "#f8fafc", padding: "12px 14px", marginTop: 8 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: "#64748b", letterSpacing: 1, textTransform: "uppercase", marginBottom: 8 }}>✓ Cross-check vs App Display</div>
            {[
              { label: "Sales", a: verify.sales, b: monthTotals.sales },
              { label: "Materials", a: verify.materials, b: monthTotals.cost },
              { label: "Profit", a: verify.profit, b: monthTotals.profit },
              { label: "Salaries", a: verify.salaries, b: monthTotals.salTotal },
              { label: "Advances", a: verify.advances, b: monthTotals.advTotal },
              { label: "Net", a: expectedNet, b: monthTotals.net },
              { label: "Outstanding", a: verify.unpaidBalance, b: monthTotals.balance },
            ].map(check => (
              <div key={check.label} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontFamily: "monospace", padding: "3px 0" }}>
                <span style={{ color: "#64748b" }}>{check.label}:</span>
                <span style={{ color: matches(check.a, check.b) ? "#10b981" : "#ef4444", fontWeight: 700 }}>
                  {matches(check.a, check.b) ? "✓ MATCH" : `✗ MISMATCH (audit ${fmt(check.a)} vs app ${fmt(check.b)})`}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* === CLIENTS LIST === */}
      {section === "clients" && (
        <div style={{ background: "#fff", borderRadius: 12, overflow: "hidden", boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
          <div style={{ background: "#0f172a", color: "#fff", padding: "12px 14px" }}>
            <div style={{ fontSize: 13, fontWeight: 800 }}>👤 Raw Client Entries — {periodLabel}</div>
            <div style={{ fontSize: 10, opacity: 0.8, fontFamily: "sans-serif", marginTop: 2 }}>{monthRows.length} entries</div>
          </div>
          {monthRows.length === 0 ? (
            <div style={{ padding: 30, textAlign: "center", color: "#94a3b8" }}>No client entries for this period.</div>
          ) : (
            monthRows.map(r => {
              const expected = checkProfit(r);
              const ok = matches(expected, r.profit);
              return (
                <div key={r.id} style={{ padding: "12px 14px", borderTop: "1px solid #f1f5f9", fontSize: 12, fontFamily: "monospace" }}>
                  <div style={{ fontWeight: 700, fontSize: 14, fontFamily: "Georgia, serif", color: "#0f172a", marginBottom: 6 }}>
                    {r.client} <span style={{ fontWeight: 400, color: "#94a3b8", fontSize: 11 }}>· {r.date}</span>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "2px 12px", color: "#475569" }}>
                    <span>Sales:</span><span style={{ textAlign: "right", color: "#0f172a", fontWeight: 700 }}>{fmt(num(r.sales))}</span>
                    <span>Deposit:</span><span style={{ textAlign: "right", color: "#0f172a" }}>{fmt(num(r.deposit))}</span>
                    <span>Balance:</span><span style={{ textAlign: "right", color: r.balance > 0 ? "#ef4444" : "#10b981" }}>{fmt(r.balance)}</span>
                    <span>Materials:</span><span style={{ textAlign: "right" }}>{fmt(r.materialsCost ?? num(r.cost))}</span>
                    <span>Tailor:</span><span style={{ textAlign: "right" }}>{fmt(num(r.tailorCost))}</span>
                    <span>Transport:</span><span style={{ textAlign: "right" }}>{fmt(num(r.transport))}</span>
                    <span>Allowance:</span><span style={{ textAlign: "right" }}>{fmt(num(r.allowance))}</span>
                    <span style={{ fontWeight: 700, color: "#0f172a" }}>Profit:</span>
                    <span style={{ textAlign: "right", fontWeight: 800, color: r.profit >= 0 ? "#10b981" : "#ef4444" }}>{fmt(r.profit)}</span>
                  </div>
                  <div style={{
                    marginTop: 8, padding: "6px 8px", background: "#f8fafc",
                    borderRadius: 6, fontSize: 10, color: "#64748b",
                  }}>
                    {fmt(num(r.sales))} − {fmt(r.materialsCost ?? num(r.cost))} − {fmt(num(r.tailorCost))} − {fmt(num(r.transport))} − {fmt(num(r.allowance))} = <strong style={{ color: ok ? "#10b981" : "#ef4444" }}>{fmt(expected)}</strong>
                    {ok ? " ✓" : ` ✗ (shown: ${fmt(r.profit)})`}
                  </div>
                  <div style={{ marginTop: 6, fontSize: 10, color: "#94a3b8" }}>
                    Paid: {r.paid ? "✅" : "❌"} · Delivered: {r.delivered ? "✅" : "❌"} · ID: {r.id?.slice(0, 8)}
                  </div>
                </div>
              );
            })
          )}
        </div>
      )}

      {/* === PAYMENTS === */}
      {section === "payments" && (
        <div style={{ background: "#fff", borderRadius: 12, overflow: "hidden", boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
          <div style={{ background: "#0f172a", color: "#fff", padding: "12px 14px" }}>
            <div style={{ fontSize: 13, fontWeight: 800 }}>💵 Staff Payments — {periodLabel}</div>
            <div style={{ fontSize: 10, opacity: 0.8, fontFamily: "sans-serif", marginTop: 2 }}>{monthPayments.length} payments</div>
          </div>
          {monthPayments.length === 0 ? (
            <div style={{ padding: 30, textAlign: "center", color: "#94a3b8" }}>No payments for this period.</div>
          ) : (
            monthPayments.map(p => (
              <div key={p.id} style={{ padding: "10px 14px", borderTop: "1px solid #f1f5f9", display: "flex", justifyContent: "space-between", fontSize: 13, fontFamily: "monospace" }}>
                <div>
                  <span style={{ color: "#0f172a", fontWeight: 700 }}>{p.type}</span>
                  <span style={{ color: "#94a3b8", marginLeft: 8 }}>· {p.date}</span>
                  {p.note && <div style={{ fontSize: 10, color: "#64748b", marginTop: 2 }}>{p.note}</div>}
                </div>
                <div style={{ fontWeight: 700, color: p.type === "Salary" ? "#7c3aed" : "#be185d" }}>{fmt(num(p.amount))}</div>
              </div>
            ))
          )}
          <div style={{ background: "#0f172a", color: "#fff", padding: "12px 14px", fontSize: 13, fontFamily: "monospace", display: "flex", justifyContent: "space-between" }}>
            <span>TOTAL:</span>
            <span style={{ fontWeight: 800 }}>{fmt(verify.salaries + verify.advances)}</span>
          </div>
        </div>
      )}

      {/* === EXPENSES === */}
      {section === "expenses" && (
        <div style={{ background: "#fff", borderRadius: 12, overflow: "hidden", boxShadow: "0 2px 8px rgba(15,23,42,0.06)" }}>
          <div style={{ background: "#0f172a", color: "#fff", padding: "12px 14px" }}>
            <div style={{ fontSize: 13, fontWeight: 800 }}>💸 Expenses — {periodLabel}</div>
            <div style={{ fontSize: 10, opacity: 0.8, fontFamily: "sans-serif", marginTop: 2 }}>{monthExpenses.length} entries</div>
          </div>
          {monthExpenses.length === 0 ? (
            <div style={{ padding: 30, textAlign: "center", color: "#94a3b8" }}>No expenses for this period.</div>
          ) : (
            monthExpenses.map(e => (
              <div key={e.id} style={{ padding: "10px 14px", borderTop: "1px solid #f1f5f9", display: "flex", justifyContent: "space-between", fontSize: 13, fontFamily: "monospace" }}>
                <div>
                  <span style={{ color: "#0f172a", fontWeight: 700 }}>{e.category}</span>
                  <span style={{ color: "#94a3b8", marginLeft: 8 }}>· {e.date}</span>
                  <span style={{ fontSize: 10, padding: "1px 6px", background: e.forBusiness !== false ? "#fee2e2" : "#dbeafe", color: e.forBusiness !== false ? "#991b1b" : "#1e40af", borderRadius: 3, marginLeft: 6, fontWeight: 700 }}>
                    {e.forBusiness !== false ? "BUSINESS" : "PERSONAL"}
                  </span>
                  {e.note && <div style={{ fontSize: 10, color: "#64748b", marginTop: 2 }}>{e.note}</div>}
                </div>
                <div style={{ fontWeight: 700, color: "#be185d" }}>{fmt(num(e.amount))}</div>
              </div>
            ))
          )}
          <div style={{ background: "#0f172a", color: "#fff", padding: "12px 14px", fontFamily: "monospace" }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
              <span>Business:</span><span style={{ fontWeight: 700 }}>{fmt(verify.expBusiness)}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginTop: 4 }}>
              <span>Personal:</span><span style={{ fontWeight: 700 }}>{fmt(verify.expPersonal)}</span>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginTop: 6, paddingTop: 6, borderTop: "1px solid #475569" }}>
              <span>TOTAL:</span><span style={{ fontWeight: 800 }}>{fmt(verify.expBusiness + verify.expPersonal)}</span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
